package:
  name: concurrent-queues
  description: An unbounded and bounded queue for concurrent access.
  publish:
    version: 3.0.1
    license: Apache-2.0
    location:
      githubOwner: purescript-contrib
      githubRepo: purescript-concurrent-queues
  build:
    strict: true
  dependencies:
    - aff: ">=7.0.0 <9.0.0"
    - arrays: ">=7.0.0 <8.0.0"
    - avar: ">=5.0.0 <6.0.0"
    - effect: ">=4.0.0 <5.0.0"
    - maybe: ">=6.0.0 <7.0.0"
    - partial: ">=4.0.0 <5.0.0"
    - prelude: ">=6.0.0 <7.0.0"
    - unfoldable: ">=6.0.0 <7.0.0"
  test:
    main: Test.Main
    dependencies:
      - assert
      - console
      - control
      - either
      - integers
      - transformers
      - tuples

workspace:
  packageSet:
    registry: 81.4.0
